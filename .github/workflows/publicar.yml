name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  # O site (pasta public/) vai para o GitHub Pages
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

  # A função da nuvem (adicionar produto, procurar lojas, atualizar) vai para o Supabase
  funcao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/preparar-funcoes.js
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          # O token colado à mão pode vir com espaços ou texto a mais: pega só o sbp_...
          TOKEN=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | grep -o 'sbp_[A-Za-z0-9_]*' | head -1)
          if [ -z "$TOKEN" ]; then echo "O segredo SUPABASE_ACCESS_TOKEN não tem um token sbp_... válido."; exit 1; fi
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          # Ajustes do banco (supabase/aplicar.sql pode rodar várias vezes sem problema)
          node -e "process.stdout.write(JSON.stringify({query: require('fs').readFileSync('supabase/aplicar.sql','utf8')}))" > /tmp/sql.json
          curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/neybxehhfveilnqzjbmw/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @/tmp/sql.json
          echo
          supabase functions deploy radar --project-ref neybxehhfveilnqzjbmw --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
